[project]
name = "ha-mcp"
version = "2.0.0"
description = "Home Assistant MCP for Hermes: covers, lights (incl. Hue), scenes"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
ha-mcp-serve = "ha_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ha_mcp"]
